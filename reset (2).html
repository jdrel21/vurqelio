<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0e0b">
  <title>Parolă nouă — Vurqelio</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="grain"></div>
  <header class="topbar wrap"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="32" height="32"><span>vurqelio<i>.</i></span></a></header>
  <main class="wrap center-page">
    <form class="modal static" id="resetForm" data-testid="reset-form">
      <h2>Parolă nouă.</h2>
      <p class="muted" id="resetInfo">Alege o parolă nouă pentru contul tău.</p>
      <label style="margin-top:22px">Parolă nouă<input id="newPass" type="password" minlength="8" autocomplete="new-password" required data-testid="reset-password-input"></label>
      <label>Confirmă parola<input id="newPass2" type="password" minlength="8" autocomplete="new-password" required data-testid="reset-password-confirm"></label>
      <button class="btn btn-lime full" id="resetBtn" disabled data-testid="reset-submit-btn">Salvează parola →</button>
      <p class="form-msg" id="resetMsg" role="status" data-testid="reset-message"></p>
    </form>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=8"></script>
  <script>
    const enable = () => { $('resetBtn').disabled = false; $('resetMsg').textContent = ''; };
    client.auth.onAuthStateChange((event, session) => { if (session) enable(); });
    client.auth.getSession().then(({ data }) => {
      if (data.session) return enable();
      setTimeout(() => {
        if ($('resetBtn').disabled) {
          $('resetMsg').className = 'form-msg err';
          $('resetMsg').textContent = 'Linkul este invalid sau a expirat. Cere unul nou din pagina de conectare.';
        }
      }, 2500);
    });
    $('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('resetMsg');
      if ($('newPass').value !== $('newPass2').value) { msg.className = 'form-msg err'; msg.textContent = 'Parolele nu coincid.'; return; }
      $('resetBtn').disabled = true;
      const { error } = await client.auth.updateUser({ password: $('newPass').value });
      if (error) { msg.className = 'form-msg err'; msg.textContent = errText(error); $('resetBtn').disabled = false; return; }
      msg.className = 'form-msg ok';
      msg.textContent = 'Parola a fost schimbată. Te ducem în panou…';
      setTimeout(() => location.href = 'dashboard.html', 1500);
    });
  </script>
  <script src="cookies.js?v=8"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"7f7b0fd8732c4326aae4b9d58d5c514a","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
