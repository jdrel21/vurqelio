<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0e0b">
  <title>Statistici campanie — Vurqelio</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="grain"></div>
  <header class="topbar wrap"><a class="brand" href="index.html"><img src="assets/logo.svg" alt="" width="32" height="32"><span>vurqelio<i>.</i></span></a><span class="tag"><b class="blink"></b> LIVE · se actualizează la 30s</span></header>
  <main class="wrap" id="stats" data-testid="campaign-stats">
    <div class="loading"><span></span>Se încarcă statisticile…</div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js?v=8"></script>
  <script src="cookies.js?v=8"></script>
  <script>
    const qs = new URLSearchParams(location.search);
    const label = { pending_payment: 'Așteaptă plata', paid: 'Plătită — în verificare', approved: 'Activă', rejected: 'Respinsă', completed: 'Finalizată' };
    const n = v => Number(v).toLocaleString('ro-RO');

    async function refresh() {
      const { data: s, error } = await client.rpc('get_campaign_stats', { p_id: qs.get('c'), p_token: qs.get('k') });
      if (error || !s) {
        $('stats').innerHTML = '<div class="empty"><span>!</span><strong>Link invalid.</strong><small>Verifică linkul primit sau scrie-ne la contact@vurqelio.com.</small></div>';
        return false;
      }
      const pct = Math.min(100, (s.views / s.views_target) * 100);
      const max = Math.max(1, ...s.daily.map(d => d.views));
      $('stats').innerHTML = `
        <div class="dash-head"><div><span class="tag">CAMPANIE ${escapeHtml(s.package.toUpperCase())} · ${s.kind === 'reel' ? 'REEL' : 'VIDEO'}</span>
          <h1>${escapeHtml(s.company)}</h1><p class="muted"><a href="${escapeHtml(s.video_url)}" target="_blank" rel="noopener">Vezi videoclipul ↗</a> · creată ${new Date(s.created_at).toLocaleDateString('ro-RO')}</p></div>
          <span class="status ${['approved', 'completed'].includes(s.status) ? 'fulfilled' : s.status === 'rejected' ? 'rejected' : ''}" data-testid="campaign-status">${label[s.status]}</span></div>
        <div class="stats">
          <div class="stat main"><small>VIZIONĂRI COMPLETE</small><strong data-testid="campaign-views">${n(s.views)}</strong><span>/ ${n(s.views_target)}</span></div>
          <div class="stat"><small>PROGRES</small><strong>${pct.toFixed(1)}%</strong><div class="bar"><i style="width:${pct}%"></i></div></div>
          <div class="stat"><small>APRECIERI</small><strong data-testid="campaign-likes">${n(s.likes)}</strong><small class="muted">♥</small></div>
          <div class="stat"><small>RĂMASE</small><strong>${n(Math.max(0, s.views_target - s.views))}</strong><small class="muted">vizionări</small></div>
        </div>
        <h3 class="sub">Ultimele 14 zile</h3>
        <div class="chart" data-testid="campaign-chart">${s.daily.length ? s.daily.map(d => `<div class="col" title="${n(d.views)} vizionări"><i style="height:${(d.views / max) * 100}%"></i><small>${new Date(d.day).toLocaleDateString('ro-RO', { day: '2-digit', month: '2-digit' })}</small><b>${n(d.views)}</b></div>`).join('') : '<div class="empty"><span>◌</span><strong>Încă nu există vizionări.</strong><small>Datele apar aici imediat ce campania e activă.</small></div>'}</div>
        <p class="note">Contorizăm doar vizionările complete, verificate pe server, câte una per utilizator. Păstrează acest link privat.</p>`;
      return true;
    }
    refresh().then(ok => ok && setInterval(refresh, 30000));
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4bc70e2c01a94c73b74392e4234840661791215815920" integrity="sha512-L0ha0OXavK/8okipN9F8BtP84dg9DUhPERbBXzwI6dgTA55d2+yweo3pn5CSFYs45/r8md2+xvUPtTdvTNRfjA==" data-cf-beacon='{"version":"2024.11.0","token":"7f7b0fd8732c4326aae4b9d58d5c514a","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
